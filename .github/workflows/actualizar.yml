name: Actualizar catálogo

on:
  schedule:
    - cron: '58 9 * * *'   # todos los días 06:58 hora de Chile (verano)
  workflow_dispatch:        # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install requests beautifulsoup4 pillow
      - name: Leer chefworks.cl y generar catálogo
        run: |
          mkdir -p scripts
          cp update.py build_site.py head.html body.html logo.png logo-dark.png scripts/
          python scripts/build_site.py
      - name: Publicar cambios
        run: |
          git config user.name "Actualizador catálogo"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html img
          git diff --cached --quiet && echo "Sin cambios" || (git commit -m "Actualización diaria del catálogo" && git push)
